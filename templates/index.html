<!DOCTYPE html>
<html>
<head>

    <title>Meowify</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background: #fafafa;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 40px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        input[type="file"] {
            margin: 30px 0;
            padding: 15px;
        }

        button {
            display: block;
            margin: auto;
            padding: 14px 30px;
            font-size: 18px;
            cursor: pointer;
        }

        .formats {
            font-size: 14px;
            color: #888;
            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🐱 Meowify</h1>

    <p>
        Turn the vocals of your song into cat meows.
    </p>

    <form
        action="/upload"
        method="POST"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            name="audio"
            accept=".mp3,.wav,.m4a,.flac,.ogg,.aac"
            required
        >

        <button type="submit">
            MEOWIFY IT 🐱
        </button>

    </form>

    <div class="formats">
        MP3, WAV, M4A, FLAC, OGG or AAC<br>
        Maximum file size: 100 MB
    </div>

</div>

</body>
</html>
